<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer Labyrinth Ring (Stylized) -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.25" stroke-dasharray="24 16" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#tealGrad)" stroke-width="5" stroke-opacity="0.3" stroke-dasharray="16 12" />

  <!-- Center Glow -->
  <circle cx="256" cy="256" r="100" fill="#f59e0b" fill-opacity="0.12" filter="url(#glow)" />

  <!-- Music Clef / Harp / Note Symbol -->
  <g transform="translate(146, 126) scale(0.85)" filter="url(#glow)">
    <!-- Treble Clef & Musical Notes Combination -->
    <path d="M 120 40 
             C 145 40, 165 60, 165 95 
             C 165 140, 125 180, 125 210 
             L 125 300 
             C 125 330, 95 350, 65 340 
             C 40 330, 30 305, 45 285 
             C 58 268, 85 272, 90 290 
             C 95 305, 85 315, 75 315 
             L 75 315 
             C 85 320, 105 310, 105 285 
             L 105 130 
             C 105 100, 115 80, 135 65 
             C 115 65, 80 85, 75 130 
             C 70 170, 95 195, 110 210 
             L 110 230 
             C 80 210, 50 175, 55 125 
             C 60 70, 90 40, 120 40 Z" 
          fill="url(#goldGrad)" />
    
    <!-- 8th Note on Right -->
    <circle cx="205" cy="245" r="28" fill="url(#goldGrad)" />
    <path d="M 225 245 L 225 90 C 225 70, 240 60, 265 55 L 265 85 C 248 90, 243 100, 243 115 L 243 245 Z" fill="url(#goldGrad)" />

    <!-- Modern ASAN Star Motif / Crown Sparkle -->
    <path d="M 130 15 L 138 32 L 155 40 L 138 48 L 130 65 L 122 48 L 105 40 L 122 32 Z" fill="#fef08a" />
  </g>

  <!-- Soundwave accents -->
  <rect x="180" y="390" width="8" height="24" rx="4" fill="#38bdf8" fill-opacity="0.8" />
  <rect x="200" y="375" width="8" height="40" rx="4" fill="#f59e0b" />
  <rect x="220" y="365" width="8" height="60" rx="4" fill="#fef08a" />
  <rect x="240" y="360" width="8" height="70" rx="4" fill="#38bdf8" />
  <rect x="260" y="360" width="8" height="70" rx="4" fill="#38bdf8" />
  <rect x="280" y="365" width="8" height="60" rx="4" fill="#fef08a" />
  <rect x="300" y="375" width="8" height="40" rx="4" fill="#f59e0b" />
  <rect x="320" y="390" width="8" height="24" rx="4" fill="#38bdf8" fill-opacity="0.8" />
</svg>
